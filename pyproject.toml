[project]
name = "condo-finder"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.15.0",
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "condofinder.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]
