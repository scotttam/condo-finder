<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Condo Finder{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { --bg:#f7f7f5; --card:#fff; --ink:#1f2328; --muted:#667085; --line:#e4e4e0; --accent:#2f6f5e;
            --yes:#1f7a4d; --no:#b42318; --unk:#8a6d00; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { display:flex; align-items:center; gap:24px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:18px; }
    header nav a { margin-right:16px; color:var(--ink); text-decoration:none; }
    main { padding:20px; max-width:1400px; margin:0 auto; }
    a { color:var(--accent); }
    .messages { list-style:none; margin:12px 20px 0; padding:10px 14px; background:#eaf4ef; border-radius:8px; }
    .layout { display:block; }
    /* Filter bar: dropdown chips */
    .filter-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:-20px -20px 16px; padding:10px 20px;
                  background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:1000; }
    .chip { position:relative; }
    .chip > summary { list-style:none; cursor:pointer; user-select:none; padding:7px 14px; border:1px solid var(--line);
                      border-radius:999px; background:var(--card); font-size:14px; white-space:nowrap; }
    .chip > summary::-webkit-details-marker { display:none; }
    .chip > summary::after { content:"▾"; margin-left:6px; color:var(--muted); font-size:11px; }
    .chip.active > summary, .chip[open] > summary { border-color:var(--accent); color:var(--accent); background:#eef6f2; font-weight:600; }
    .chip-panel { position:absolute; top:calc(100% + 6px); left:0; min-width:260px; background:var(--card); border:1px solid var(--line);
                  border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.12); padding:14px 16px; z-index:1001; }
    .chip-panel.drawer { width:min(640px, calc(100vw - 40px)); }
    .panel-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:12px 0 6px; }
    .panel-title:first-child { margin-top:0; }
    .segmented { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .segmented label { flex:1; margin:0; }
    .segmented input { position:absolute; opacity:0; pointer-events:none; }
    .segmented span { display:block; text-align:center; padding:7px 8px; font-size:14px; cursor:pointer; border-right:1px solid var(--line); }
    .segmented label:last-child span { border-right:0; }
    .segmented input:checked + span { background:var(--accent); color:#fff; font-weight:600; }
    .check-list label, label.inline { display:block; font-size:14px; padding:3px 0; cursor:pointer; }
    .check-list.columns { columns:2; }
    label.field { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px; padding:3px 0; }
    .chip-panel input[type=text], .chip-panel select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    .chip-panel input[type=text] { width:100%; }
    .drawer-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .quadrant-grid { display:grid; grid-template-columns:repeat(2, 72px); grid-template-areas:"n n" "nw ne" "sw se" "s s"; gap:4px; justify-content:start; }
    .quadrant-tile { margin:0; } .quadrant-tile input { position:absolute; opacity:0; pointer-events:none; }
    .quadrant-tile span { display:block; text-align:center; padding:8px 0; border:1px solid var(--line); border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; }
    .quadrant-tile input:checked + span { background:var(--accent); border-color:var(--accent); color:#fff; }
    .q-N { grid-area:n; } .q-NW { grid-area:nw; } .q-NE { grid-area:ne; } .q-SW { grid-area:sw; } .q-SE { grid-area:se; } .q-S { grid-area:s; }
    .range-slider { position:relative; height:28px; }
    .range-slider input[type=range] { position:absolute; left:0; right:0; width:100%; top:6px; margin:0; background:none; pointer-events:none; -webkit-appearance:none; appearance:none; }
    .range-slider input[type=range]::-webkit-slider-thumb { pointer-events:auto; -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:pointer; }
    .range-slider input[type=range]::-moz-range-thumb { pointer-events:auto; width:16px; height:16px; border-radius:50%; background:var(--accent); border:2px solid #fff; cursor:pointer; }
    .range-slider::before { content:""; position:absolute; left:0; right:0; top:13px; height:4px; border-radius:2px; background:var(--line); }
    .range-values { display:flex; justify-content:space-between; font-weight:600; font-size:14px; }
    .more-count[hidden] { display:none; }
    .more-count { display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:var(--accent); color:#fff; font-size:12px; text-align:center; }
    .filter-bar .reset { font-size:14px; margin-left:4px; }
    .results-controls { display:flex; align-items:center; gap:12px; }
    .sort { font-size:14px; color:var(--muted); } .sort select { margin-left:6px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); background:var(--card); }
    #map { height:380px; border-radius:10px; border:1px solid var(--line); margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .card img { width:100%; height:180px; object-fit:cover; background:#ddd; }
    .card .body { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
    .price { font-size:20px; font-weight:700; }
    .muted { color:var(--muted); font-size:13px; }
    .feat { display:inline-block; font-size:12px; padding:1px 7px; border-radius:10px; margin:0 4px 4px 0; border:1px solid currentColor; }
    .feat.yes { color:var(--yes); } .feat.no { color:var(--no); } .feat.unk { color:var(--unk); }
    .status { font-size:12px; padding:2px 8px; border-radius:10px; background:#eef; }
    .status-interested { background:#e3f5ea; } .status-rejected { background:#fde8e7; } .status-toured, .status-applied { background:#fff4d6; }
    .status-controls { display:flex; gap:6px; align-items:center; margin-top:auto; }
    .status-controls button { font-size:12px; padding:3px 8px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
    .offmarket { color:var(--no); font-weight:600; font-size:12px; }
    table { border-collapse:collapse; width:100%; background:var(--card); }
    th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
    .detail { display:grid; grid-template-columns:1fr 360px; gap:24px; }
    .detail img.hero { width:100%; max-height:420px; object-fit:cover; border-radius:10px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
    .description { white-space:pre-line; }
    .saved { color:var(--yes); margin-left:8px; }
    .results-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .results-bar p { margin:0; }
    .view-toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card); }
    .view-toggle a { padding:6px 16px; text-decoration:none; color:var(--ink); font-size:14px; }
    .view-toggle a.active { background:var(--accent); color:#fff; }
    .card-photo { position:relative; display:block; }
    .source-badges { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:4px; }
    .source-badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:rgba(31,35,40,.78); color:#fff; margin:0 4px 4px 0; white-space:nowrap; }
    .source-badges .source-badge { margin:0; }
    .listing-table td .source-badge { background:#eef1ef; color:var(--ink); }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
    .listing-table { min-width:1100px; }
    .listing-table th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#fafaf8; position:sticky; top:0; }
    .listing-table .thumb { width:88px; height:60px; object-fit:cover; border-radius:6px; background:#ddd; display:block; }
    .listing-table .status-controls { flex-wrap:wrap; }
    .nowrap { white-space:nowrap; }
    .drop { color:var(--yes); font-weight:600; font-size:13px; }
    .price .drop { margin-left:6px; }
    table.history td, table.history th { font-size:13px; padding:5px 6px; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:18px; margin:20px 0 8px; }
    .pagination a, .pagination .disabled { padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); text-decoration:none; }
    .pagination .disabled { color:var(--muted); opacity:.5; }
    #results.htmx-request { opacity:.55; transition:opacity .15s; }
    @media (max-width: 800px) { .layout, .detail { grid-template-columns:1fr; } .drawer-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header>
    <a class="brand" href="{% url 'listing_list' %}">Condo Finder</a>
    <nav>
      <a href="{{ listings_url }}">Listings</a>
      <a href="{% url 'sources' %}">Sources</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>
  {% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
