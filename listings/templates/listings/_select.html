{# A select from a form's home_menus / search_menus: name, options, optional form_id and label. #}<select name="{{ name }}"{% if form_id %} form="{{ form_id }}"{% endif %}{% if label %} aria-label="{{ label }}"{% endif %}>
  {% for option in options %}<option value="{{ option.value }}"{% if option.selected %} selected{% endif %}>{{ option.label }}</option>{% endfor %}
</select>
