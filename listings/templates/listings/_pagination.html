{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages"
     hx-boost="true" hx-target="#results" hx-select="#results" hx-swap="outerHTML show:window:top">
  {% if prev_url %}<a href="{{ prev_url }}" rel="prev">← Previous</a>{% else %}<span class="disabled">← Previous</span>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if next_url %}<a href="{{ next_url }}" rel="next">Next →</a>{% else %}<span class="disabled">Next →</span>{% endif %}
</nav>
{% endif %}
